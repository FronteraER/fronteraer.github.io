name: Publicar página

# La página ahora se publica sola desde la rama main (Settings → Pages →
# "Deploy from a branch"), y los datos se leen directo del repositorio.
# Este workflow queda solo para que el proceso de medición no falle al llamarlo.
on:
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub Pages publica la rama main automáticamente."
