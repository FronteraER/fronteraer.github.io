name: Medir pasos y publicar

on:
  schedule:
    - cron: "7 * * * *"   # una vez por hora (minuto 7, para evitar la congestión de GitHub en punto)
    # Visita del Papa: cada 15 min del 6 al 8 de noviembre (hora UTC; abarca
    # desde el jueves 5 a las 21 h hasta el domingo 8 a las 21 h de Argentina).
    # Borrar esta línea después del evento.
    - cron: "2,17,32,47 * 6-8 11 *"
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: medir
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Medir
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          DEBUG_TOMTOM: "1"   # imprime en el log lo que responde TomTom (sin la clave)
        run: python3 monitor_pasos.py --una-vez

      - name: Guardar datos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in datos.json pasos.csv pronostico.json; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Medición $(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M')" || echo "Sin cambios"
          git pull --rebase
          git push

      - name: Preparar sitio
        run: mkdir -p _site && cp index.html datos.json _site/ && (cp pronostico.json _site/ || true)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
