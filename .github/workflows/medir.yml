name: Medir pasos (continuo)

# GitHub no garantiza los horarios programados (de noche salteó casi todos),
# así que este workflow queda corriendo y mide él mismo cada 15 minutos.
# Un job puede durar hasta 6 h: a las 5 h 30 min se relanza solo.
# El cron de cada hora es solo un respaldo por si la cadena se corta.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write
  actions: write     # para lanzar la publicación y relanzarse

concurrency:
  group: medir
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Medir cada 15 min (cada hora después del evento)
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FIN=$(( $(date +%s) + 5*3600 + 30*60 ))
          FIN_EVENTO=$(date -d '2026-11-12T00:00:00-03:00' +%s)   # hasta después de Luján
          while :; do
            python3 monitor_pasos.py --una-vez || echo "La medición falló; sigo"
            for f in datos.json pasos.csv; do [ -f "$f" ] && git add "$f"; done
            git commit -q -m "Medición $(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M')" || true
            git pull -q --rebase && git push -q || echo "No se pudo subir; reintento en la próxima"
            gh workflow run publicar.yml --ref main || echo "No se pudo lanzar la publicación"
            if [ $(date +%s) -lt $FIN_EVENTO ]; then INT=900; else INT=3600; fi
            PROX=$(( ( $(date +%s) / INT + 1 ) * INT ))
            [ $PROX -ge $FIN ] && break
            sleep $(( PROX - $(date +%s) ))
          done
          gh workflow run medir.yml --ref main
